<div class="relative min-h-screen p-4 lg:p-6">
        <div class="grid h-[calc(100vh-2rem)] grid-cols-1 gap-4 xl:h-[calc(100vh-3rem)] xl:grid-cols-[22rem,minmax(0,1fr)]">
            <aside class="glass-card flex min-h-0 flex-col rounded-[1.6rem] p-5">
                <div class="flex items-start justify-between gap-4">
                    <div>
                        <p class="text-[11px] font-semibold uppercase tracking-[0.32em] text-cyan-300/80">Motion Capture</p>
                        <h1 class="mt-2 text-2xl font-semibold text-white">Motion Ripper</h1>

                    </div>
                </div>

                <div class="mt-5 space-y-3">
                    <div class="grid grid-cols-1 gap-2">
                        <button id="upload-video-btn" class="flex w-full items-center justify-center rounded-2xl bg-purple-500 px-4 py-3 text-sm font-semibold text-slate-950 transition hover:bg-purple-400">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            Upload Video
                        </button>
                    </div>
                    <input id="video-file-input" type="file" accept="video/*" style="display: none;">
                </div>

                <div class="mt-5 rounded-3xl border border-white/10 bg-white/[0.035] p-4">
                    <div class="flex items-center justify-between gap-3">
                        <h2 class="text-sm font-semibold text-white">Recording</h2>
                        <span id="recording-badge" class="rounded-full border border-emerald-400/20 bg-emerald-400/10 px-2.5 py-1 text-[11px] font-semibold uppercase tracking-[0.22em] text-emerald-200">Idle</span>
                    </div>

                    <div class="mt-4 space-y-3">
                        <div class="grid grid-cols-2 gap-3">
                            <label class="block">
                                <span class="mb-1.5 block text-xs font-semibold uppercase tracking-[0.18em] text-slate-400">Character Color</span>
                                <input id="character-color" type="color" value="#5eead4" class="h-[46px] w-full cursor-pointer rounded-2xl border border-white/10 bg-slate-950/70 p-1.5">
                            </label>
                            <label class="block">
                                <span class="mb-1.5 block text-xs font-semibold uppercase tracking-[0.18em] text-slate-400">Sample Rate</span>
                                <select id="sample-rate" class="h-[46px] w-full rounded-2xl border border-white/10 bg-slate-950/70 px-3 text-sm text-white outline-none transition focus:border-cyan-400">
                                    <option value="10">10 fps</option>
                                    <option value="5">5 fps</option>
                                </select>
                            </label>
                        </div>

                        <label class="block">
                            <div class="mb-1.5 flex items-center justify-between gap-3">
                                <span class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-400">Pose Smoothing</span>
                                <span id="smoothing-value" class="text-xs font-semibold text-cyan-200">0.55</span>
                            </div>
                            <input id="smoothing" type="range" min="0" max="0.85" step="0.05" value="0.55" class="w-full accent-cyan-400">
                        </label>

                        <label class="block">
                            <span class="mb-1.5 block text-xs font-semibold uppercase tracking-[0.18em] text-slate-400">Pose Backend</span>
                            <select id="pose-backend" class="h-[46px] w-full rounded-2xl border border-white/10 bg-slate-950/70 px-3 text-sm text-white outline-none transition focus:border-cyan-400">
                                <option value="mediapipe-video">MediaPipe Video</option>
                                <option value="mediapipe-image">MediaPipe Image Search</option>
                                <option value="movenet">MoveNet Search</option>
                                <option value="manual">Manual Assist</option>
                            </select>
                        </label>

                        <label id="root-motion-field" class="flex items-start gap-3 rounded-2xl border border-white/10 bg-slate-950/45 px-3 py-3">
                            <input id="root-motion" type="checkbox" checked class="mt-1 h-4 w-4 rounded border-white/20 bg-slate-950 text-cyan-400 focus:ring-cyan-400">
                            <span>
                                <span class="block text-sm font-medium text-white">Track root motion</span>
                                <span class="mt-1 block text-xs leading-5 text-slate-400">Moves hips in X/Y/Z relative to your neutral frame. Turn this off if you only want limb motion.</span>
                            </span>
                        </label>

                        <label class="flex items-start gap-3 rounded-2xl border border-white/10 bg-slate-950/45 px-3 py-3">
                            <input id="upper-body-only" type="checkbox" class="mt-1 h-4 w-4 rounded border-white/20 bg-slate-950 text-cyan-400 focus:ring-cyan-400">
                            <span>
                                <span class="block text-sm font-medium text-white">Upper-body source</span>
                                <span class="mt-1 block text-xs leading-5 text-slate-400">Uses head, shoulders, and arms while keeping hips and legs in a planted standing pose.</span>
                            </span>
                        </label>

                        <div class="rounded-2xl border border-white/10 bg-slate-950/45 px-3 py-3">
                            <label class="flex items-start gap-3">
                                <input id="focus-crop" type="checkbox" class="mt-1 h-4 w-4 rounded border-white/20 bg-slate-950 text-cyan-400 focus:ring-cyan-400">
                                <span>
                                    <span class="block text-sm font-medium text-white">Focus crop</span>
                                    <span class="mt-1 block text-xs leading-5 text-slate-400">Drag over the Pose Feed to isolate the actual video frame before tracking.</span>
                                </span>
                            </label>
                            <button id="reset-crop-btn" class="mt-3 w-full rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-xs font-medium text-slate-200 transition hover:bg-white/10" type="button">
                                Reset Crop
                            </button>
                        </div>

                    </div>


                </div>


            </aside>

            <main class="grid min-h-0 grid-cols-1 gap-4 2xl:grid-cols-[1.08fr,0.92fr]">
                <section class="glass-card flex min-h-0 flex-col rounded-[1.8rem] p-4">
                    <div class="mb-3 flex items-center justify-between gap-4">
                        <div>
                            <p class="text-[11px] font-semibold uppercase tracking-[0.24em] text-slate-500">Shared Video</p>
                            <h2 class="mt-1 text-lg font-semibold text-white">Pose Feed</h2>
                        </div>
                        <span id="video-meta" class="rounded-full border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-medium text-slate-300">No stream</span>
                    </div>
                    <div id="video-stage" class="min-h-0 flex-1 rounded-[1.5rem] border border-white/10 bg-slate-950/90">
                        <video id="source-video" autoplay muted playsinline></video>
                        <canvas id="pose-overlay"></canvas>
                    </div>
                </section>

                <section class="glass-card flex min-h-0 flex-col rounded-[1.8rem] p-4">
                    <div class="mb-3 flex items-center justify-between gap-4">
                        <div>
                            <p class="text-[11px] font-semibold uppercase tracking-[0.24em] text-slate-500">Rig Preview</p>
                            <h2 class="mt-1 text-lg font-semibold text-white">Mapped Character</h2>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="block">
                            <span class="mb-1.5 block text-xs font-semibold uppercase tracking-[0.18em] text-slate-400">Character Model</span>
                            <select id="character-model" class="h-[38px] w-full rounded-2xl border border-white/10 bg-slate-950/70 px-3 text-sm text-white outline-none transition focus:border-cyan-400">
                                <option value="box">Box Character</option>
                                <option value="lady-x-bot">Lady-X Bot</option>
                            </select>
                        </label>
                    </div>
                    <div class="min-h-0 flex-1 overflow-hidden rounded-[1.5rem] border border-white/10 bg-[radial-gradient(circle_at_top,_rgba(34,197,94,0.16),_transparent_36%),linear-gradient(180deg,_rgba(15,23,42,0.95),_rgba(2,6,23,1))]">
                        <canvas id="preview-canvas"></canvas>
                    </div>
                </section>
            </main>
        </div>
    </div>
